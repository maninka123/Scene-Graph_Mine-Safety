base_config: "MinkUNET/configs/base.yaml"

train:
  batch_size: 4
  epochs: 80
  lr: 0.0008
  weight_decay: 0.0001
  amp: true
  grad_clip_norm: 5.0

pretrain:
  projection_dim: 128
  temperature: 0.1
  checkpoint_name: "contrastive_best.pt"
  augmentation:
    rotation_deg: 180.0
    scale_min: 0.9
    scale_max: 1.1
    jitter_std: 0.01
    jitter_clip: 0.03
    point_dropout: 0.1
    translation: 0.1
