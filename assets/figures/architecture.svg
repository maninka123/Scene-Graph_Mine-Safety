<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Paper-aligned mine safety reasoning architecture</title>
  <desc id="desc">Flow from colourised point clouds through sparse perception, graphs, rules, local language reasoning, and GraphRAG memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0a84ff"/><stop offset="1" stop-color="#64d2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#728197"/></marker>
  </defs>
  <rect width="1400" height="430" rx="32" fill="url(#bg)"/>
  <text x="55" y="58" fill="#64d2ff" font-family="system-ui" font-size="16" font-weight="700" letter-spacing="2">PERCEPTION → TRACEABLE SAFETY REASONING</text>
  <g font-family="system-ui" filter="url(#shadow)">
    <g transform="translate(55 105)"><rect width="205" height="205" rx="24" fill="#172235" stroke="#31415a"/><circle cx="102" cy="68" r="32" fill="url(#blue)" opacity=".92"/><text x="102" y="130" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">Colourised 3D</text><text x="102" y="159" text-anchor="middle" fill="#aab6c6" font-size="16">point cloud</text></g>
    <g transform="translate(310 105)"><rect width="205" height="205" rx="24" fill="#172235" stroke="#31415a"/><path d="M60 85h85M72 65h61M72 105h61" stroke="#30d158" stroke-width="10" stroke-linecap="round"/><text x="102" y="130" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">MinkUNet</text><text x="102" y="159" text-anchor="middle" fill="#aab6c6" font-size="16">9 classes + entropy</text></g>
    <g transform="translate(565 105)"><rect width="205" height="205" rx="24" fill="#172235" stroke="#31415a"/><circle cx="65" cy="72" r="14" fill="#bf5af2"/><circle cx="140" cy="62" r="14" fill="#ff9f0a"/><circle cx="106" cy="104" r="14" fill="#30d158"/><path d="M77 69l49-5M76 81l21 17M120 95l12-22" stroke="#8e9aab" stroke-width="4"/><text x="102" y="130" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">Scene graph</text><text x="102" y="159" text-anchor="middle" fill="#aab6c6" font-size="16">objects + 8 m edges</text></g>
    <g transform="translate(820 105)"><rect width="205" height="205" rx="24" fill="#172235" stroke="#31415a"/><path d="M55 65h95M55 85h72M55 105h84" stroke="#ffd60a" stroke-width="7" stroke-linecap="round"/><text x="102" y="130" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">Hybrid reasoning</text><text x="102" y="159" text-anchor="middle" fill="#aab6c6" font-size="16">rules + local Qwen</text></g>
    <g transform="translate(1075 105)"><rect width="270" height="205" rx="24" fill="#172235" stroke="#31415a"/><ellipse cx="135" cy="62" rx="55" ry="20" fill="#ff375f"/><path d="M80 62v46c0 11 25 20 55 20s55-9 55-20V62" fill="#ff375f" opacity=".7"/><text x="135" y="157" text-anchor="middle" fill="#f5f5f7" font-size="21" font-weight="700">Selective GraphRAG</text><text x="135" y="184" text-anchor="middle" fill="#aab6c6" font-size="16">local historical memory</text></g>
  </g>
  <g stroke="#728197" stroke-width="4" marker-end="url(#arrow)"><path d="M270 207h28"/><path d="M525 207h28"/><path d="M780 207h28"/><path d="M1035 207h28"/></g>
  <text x="55" y="365" fill="#8e9aab" font-family="system-ui" font-size="17">Deterministic alerts remain authoritative; probabilistic reasoning is advisory, validated, and evidence-linked.</text>
</svg>
