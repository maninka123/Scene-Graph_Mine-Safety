[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mine-safety-reasoning"
version = "1.0.0"
description = "Paper-aligned 3D perception-to-safety-reasoning pipeline for underground mine monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
app = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
llm = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.30", "sentence-transformers>=3.0", "qdrant-client>=1.10"]
pointcloud = ["open3d>=0.18"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mine-safety = "mine_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
